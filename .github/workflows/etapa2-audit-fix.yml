name: Etapa 2 — Corrigir vulnerabilidades de dependências (manual)

on:
  push:
    branches: [feature/expansao-operacional-etapa2-integrada]
    paths: ['.github/workflows/etapa2-audit-fix.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expansao-operacional-etapa2-integrada
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Atualizar apenas versões com correção compatível
        run: npm audit fix
      - name: Conferir
        run: |
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run test:unit
          npm run build
      - name: Commitar lockfile
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore(deps): npm audit fix (dompurify, re2js)"
          git push origin HEAD:feature/expansao-operacional-etapa2-integrada
