name: Firestore Rules Tests

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - tests/firestore.rules.test.ts
      - firebase.test.json
      - package.json
      - package-lock.json
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - tests/firestore.rules.test.ts
      - firebase.test.json
      - package.json
      - package-lock.json
  workflow_dispatch:

jobs:
  test-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules
