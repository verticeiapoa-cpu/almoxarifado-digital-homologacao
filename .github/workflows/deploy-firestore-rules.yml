name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Normalize Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const original = process.env.FIREBASE_SERVICE_ACCOUNT_JSON || '';
          if (!original) {
            console.error('Firebase service account secret is empty.');
            process.exit(1);
          }

          const cleanBom = s => String(s).replace(/^\uFEFF/, '').trim();
          const candidates = [];
          const push = v => {
            if (typeof v !== 'string') return;
            v = cleanBom(v);
            if (v && !candidates.includes(v)) candidates.push(v);
          };

          push(original);

          // JSON string containing a JSON object.
          try {
            const outer = JSON.parse(cleanBom(original));
            if (typeof outer === 'string') push(outer);
          } catch {}

          // Common copy/paste wrapping.
          const t = cleanBom(original);
          if ((t.startsWith("'") && t.endsWith("'")) || (t.startsWith('"') && t.endsWith('"'))) {
            push(t.slice(1, -1));
          }

          // Literal escaped newlines/quotes copied from another UI.
          push(t.replace(/\\n/g, '\n').replace(/\\r/g, '\r').replace(/\\"/g, '"'));

          // Base64 and Base64URL.
          for (const base of [...candidates]) {
            for (const normalized of [
              base.replace(/\s+/g, ''),
              base.replace(/-/g, '+').replace(/_/g, '/').replace(/\s+/g, '')
            ]) {
              try { push(Buffer.from(normalized, 'base64').toString('utf8')); } catch {}
            }
          }

          // URL encoded text.
          for (const base of [...candidates]) {
            try { push(decodeURIComponent(base)); } catch {}
          }

          let parsed = null;
          for (const candidate of candidates) {
            try {
              const value = JSON.parse(candidate);
              if (value && value.type === 'service_account' && value.client_email && value.private_key) {
                parsed = value;
                break;
              }
            } catch {}
          }

          if (!parsed) {
            const bytes = Buffer.byteLength(original, 'utf8');
            const trimmed = cleanBom(original);
            const looksJson = trimmed.startsWith('{') && trimmed.endsWith('}');
            const hasServiceAccountMarker = trimmed.includes('"type"') || trimmed.includes('service_account');
            const looksPem = trimmed.includes('BEGIN PRIVATE KEY');
            console.error(`Credential secret could not be normalized. bytes=${bytes}, looksJson=${looksJson}, hasServiceAccountMarker=${hasServiceAccountMarker}, looksPem=${looksPem}`);
            process.exit(1);
          }

          if (parsed.project_id && parsed.project_id !== 'gen-lang-client-0038131539') {
            console.error('Credential belongs to a different Google Cloud project.');
            process.exit(1);
          }

          const target = path.join(process.env.RUNNER_TEMP, 'firebase-service-account.json');
          fs.writeFileSync(target, JSON.stringify(parsed), { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${target}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_CLOUD_PROJECT=${parsed.project_id || 'gen-lang-client-0038131539'}\n`);
          console.log('Service account credential normalized successfully.');
          NODE

      - name: Deploy Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.22.1 deploy \
            --project gen-lang-client-0038131539 \
            --only firestore:ai-studio-docbrief-694b79f8-8d07-4aec-ab6b-3d02339ff834 \
            --non-interactive
