name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: gen-lang-client-0038131539
          create_credentials_file: true
          export_environment_variables: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify authenticated project
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));if(!p.client_email||!p.private_key)process.exit(1);console.log('Service account credentials loaded for project:', p.project_id || 'unknown');"

      - name: Deploy Firestore rules
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.22.1 deploy \
            --project gen-lang-client-0038131539 \
            --only firestore:ai-studio-docbrief-694b79f8-8d07-4aec-ab6b-3d02339ff834 \
            --non-interactive
