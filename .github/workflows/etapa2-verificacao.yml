name: Etapa 2 — Verificação (somente testes, sem deploy)

on:
  push:
    branches: [feature/expansao-operacional-etapa2-integrada]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Tipagem (lint)
        run: npm run lint
      - name: Testes unitários
        run: npm run test:unit
      - name: Testes de regras (emulador Firestore, sem credenciais)
        run: npm run test:rules
      - name: Build
        run: npm run build
