name: Dependency Security Audit

on:
  push:
    branches:
      - feature/etapa2-finalizacao-auditoria
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-security.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/etapa2-finalizacao-auditoria
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Capture baseline audit
        run: |
          npm audit --json > audit-before.json || true
          node -e "const a=require('./audit-before.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
      - name: Apply compatible dependency fixes only
        run: npm audit fix
      - name: Reinstall from updated lockfile
        run: npm ci
      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Full dependency audit
        continue-on-error: true
        run: npm audit
      - name: Capture final audit JSON
        if: always()
        run: |
          npm audit --json > audit-after.json || true
          node -e 'const a=require("./audit-after.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))'
      - name: TypeScript validation
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Firestore rules emulator tests
        run: npm run test:rules
      - name: Production build
        run: npm run build
      - name: Save audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            audit-before.json
            audit-after.json
            package-lock.json
          if-no-files-found: ignore
      - name: Commit compatible lockfile updates
        if: success()
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: apply compatible dependency security fixes"
            git push origin HEAD:feature/etapa2-finalizacao-auditoria
          else
            echo "No compatible lockfile updates were required."
          fi
