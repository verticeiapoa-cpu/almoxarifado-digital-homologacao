# Validates the current lockfile, build, PDF generation and runtime dependencies.
name: Application Quality

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/**'
      - '.github/workflows/application-quality.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: PDF generation
        run: npx vitest run tests/pdfGenerator.test.ts
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
