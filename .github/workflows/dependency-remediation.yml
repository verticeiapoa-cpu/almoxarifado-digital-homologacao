name: Dependency Remediation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply safe npm audit fixes
        run: npm audit fix || true
      - name: TypeScript
        run: npm run lint
      - name: PDF generation
        run: npx vitest run tests/pdfGenerator.test.ts
      - name: Production build
        run: npm run build
      - name: Commit safe dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency updates were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: apply safe dependency security updates"
          git push
